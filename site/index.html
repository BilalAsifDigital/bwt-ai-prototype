<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wellows · AI Performance</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Wellows design tokens (from platform-frontend tailwind.config.mjs, light theme) */
  :root {
    --canvas: #F7FAFC;
    --card: #ffffff;
    --gray-100: #F8F9FA; --gray-200: #E9ECEF; --gray-300: #DBDFE9; --gray-400: #CED4DA;
    --gray-500: #ADB5BD; --gray-600: #6C757D; --gray-700: #4B5675; --gray-800: #252F4A;
    --gray-900: #212529;
    --brand: #FF6F1E; --brand-active: #F15700; --brand-light: #FFF5EF;
    --primary: #0554F2; --primary-light: #E6EEFE;
    --success: #15803D; --success-light: #E8F2EC;
    --danger: #B63936; --danger-light: #FCF0EF;
    --warning: #F59E0B; --warning-light: #FEF3C7; --warning-ink: #4B3005;
    --card-shadow: 0px 3px 4px 0px rgba(0, 0, 0, 0.03);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--gray-800);
         font: 400 14px/1.5 'Inter', -apple-system, sans-serif; }

  header { background: var(--card); border-bottom: 1px solid var(--gray-200); height: 70px;
           padding: 0 30px; display: flex; align-items: center; gap: 14px; }
  header .logo { display: flex; align-items: center; }
  header .logo img { height: 22px; display: block; }
  header .divider { width: 1px; height: 24px; background: var(--gray-300); }
  header .app-name { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  header .tag { color: var(--brand); background: var(--brand-light); font-size: 11px;
                font-weight: 600; border-radius: 4px; padding: 3px 8px; letter-spacing: .02em;
                text-transform: uppercase; }
  main { max-width: 1280px; margin: 0 auto; padding: 30px 30px 60px; }

  .panel { background: var(--card); border: 1px solid var(--gray-200); border-radius: 12px;
           box-shadow: var(--card-shadow); padding: 22px 26px; margin-bottom: 20px; }
  h2 { font-size: 15px; font-weight: 600; color: var(--gray-800); margin: 0 0 12px; }
  h3 { font-size: 11px; font-weight: 600; margin: 20px 0 10px; color: var(--gray-600);
       text-transform: uppercase; letter-spacing: .06em; }
  p { color: var(--gray-700); }

  button { background: var(--brand); color: #fff; border: 0; border-radius: 8px;
           height: 40px; padding: 0 16px; font: 500 14px 'Inter', sans-serif; cursor: pointer;
           transition: background .15s; }
  button:hover { background: var(--brand-active); }
  button.secondary { background: var(--card); color: var(--gray-700);
                     border: 1px solid var(--gray-300); }
  button.secondary:hover { background: var(--gray-100); }
  button:disabled { opacity: .5; cursor: default; }
  button.sm { height: 32px; font-size: 13px; padding: 0 12px; }

  input[type=text], input[type=password], input[type=number], select {
    border: 1px solid var(--gray-300); border-radius: 8px; height: 40px; padding: 0 12px;
    font: 400 14px 'Inter', sans-serif; background: var(--card); color: var(--gray-800); }
  input:focus { outline: none; border-color: var(--gray-500); }
  input[type=file] { font: 400 13px 'Inter', sans-serif; color: var(--gray-700); }
  label { font-size: 13px; color: var(--gray-600); display: block; margin-bottom: 5px; font-weight: 500; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--gray-700); font-weight: 600; font-size: 12px;
       padding: 12px 16px; background: var(--gray-100); border-bottom: 1px solid var(--gray-200);
       white-space: nowrap; }
  th:first-child { border-radius: 8px 0 0 8px; } th:last-child { border-radius: 0 8px 8px 0; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--gray-200); vertical-align: top;
       color: var(--gray-800); }
  tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }

  .pill { display: inline-block; border-radius: 4px; padding: 3px 10px; font-size: 12px; font-weight: 500; }
  .pill.ok   { background: var(--success-light); color: var(--success); }
  .pill.bad  { background: var(--danger-light);  color: var(--danger); }
  .pill.warn { background: var(--warning-light); color: var(--warning-ink); }
  .pill.mut  { background: var(--gray-100); color: var(--gray-600); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .tile { border: 1px solid var(--gray-200); border-radius: 12px; padding: 16px 18px;
          background: var(--card); box-shadow: var(--card-shadow); }
  .tile .n { font-size: 24px; font-weight: 700; color: var(--gray-800); }
  .tile .l { color: var(--gray-600); font-size: 12px; margin-top: 2px; }

  .tabs { display: flex; gap: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--gray-200);
          overflow-x: auto; }
  .tabs button { background: none; color: var(--gray-600); border: 0; border-bottom: 2px solid transparent;
                 border-radius: 0; padding: 0 2px 12px; height: auto; font-weight: 500; font-size: 14px;
                 white-space: nowrap; }
  .tabs button:hover { background: none; color: var(--gray-800); }
  .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  .muted { color: var(--gray-600); }
  .small { font-size: 12px; }
  .err { color: var(--danger); }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  progress { width: 100%; height: 8px; appearance: none; -webkit-appearance: none; }
  progress::-webkit-progress-bar { background: var(--gray-200); border-radius: 8px; }
  progress::-webkit-progress-value { background: var(--brand); border-radius: 8px; }
  progress::-moz-progress-bar { background: var(--brand); border-radius: 8px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--gray-800); color: #fff; border-radius: 8px; padding: 11px 20px;
           font-size: 13px; display: none; box-shadow: 0px 7px 18px rgba(0,0,0,.09); }

  .auth-wrap { min-height: calc(100vh - 70px); display: flex; align-items: flex-start;
               justify-content: center; padding-top: 10vh; }
  .auth-card { background: var(--card); border: 1px solid var(--gray-200); border-radius: 12px;
               box-shadow: var(--card-shadow); padding: 34px; width: 400px; }
  .auth-card .logo { margin-bottom: 18px; }

  /* inline-editable suggestion text */
  input.qedit { border: 1px solid transparent; border-radius: 6px; height: 30px; padding: 0 8px;
                font: 500 13px 'Inter', sans-serif; width: 100%; min-width: 220px;
                background: transparent; color: var(--gray-800); }
  input.qedit:hover { border-color: var(--gray-300); background: var(--card); }
  input.qedit:focus { border-color: var(--gray-500); background: var(--card); outline: none; }

  /* trend chart */
  .chart-wrap { position: relative; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--gray-800); color: #fff;
               font-size: 12px; padding: 6px 10px; border-radius: 6px; white-space: nowrap;
               transform: translate(-50%, -130%); display: none; z-index: 5; }
  .minibar { height: 4px; border-radius: 4px; background: var(--primary); min-width: 2px; }
  .minitrack { background: var(--gray-200); border-radius: 4px; height: 4px; width: 160px; }
</style>
</head>
<body>
<header>
  <span class="logo"><img src="logo.svg" alt="Wellows"></span>
  <span class="divider"></span>
  <span class="app-name">AI Performance</span>
  <span class="tag">Prototype</span>
  <span id="who" class="muted small" style="margin-left:auto"></span>
</header>
<main id="app"><div class="panel">Loading…</div></main>
<div id="toast"></div>

<script type="module">
import { detectReportType, parseQueriesReport, parsePagesReport, parseOverviewReport } from "./js/lib/parseBwt.mjs";
import { buildSuggestions } from "./js/lib/suggest.mjs";

const PROVIDER_LABELS = {
  copilot: "Copilot", openai: "ChatGPT", perplexity: "Perplexity", gemini: "Gemini",
  google_ai_mode: "Google AI Mode", google_ai_overview: "AI Overviews",
};
const INTENTS = ["informational", "commercial", "transactional", "navigational"];

const state = {
  passcode: localStorage.getItem("proto_passcode") || "",
  health: null, // /api/health result: which server-side pieces a live run depends on
  projects: [], current: null,
  suggestions: [], selected: new Set(),
  run: null, tab: "overview", minCitations: 20, showAllPages: false,
};

const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const domainOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
function toast(msg, ms = 2600) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ms);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Passcode": state.passcode, ...(opts.headers || {}) },
  });
  if (res.status === 401) { renderPasscode(); throw new Error("unauthorized"); }
  if (!res.ok && !(res.headers.get("content-type") || "").includes("json")) {
    throw new Error(`HTTP ${res.status} from ${path} (no JSON body). The Netlify functions may not be deployed.`);
  }
  return res;
}

// Providers the server can actually run (from /api/health), never the static label list.
function runnableProviders() {
  const list = state.health?.providers || Object.keys(PROVIDER_LABELS).filter((k) => k !== "copilot");
  return list.filter((k) => PROVIDER_LABELS[k]);
}

// One-line banner explaining why live runs cannot work on this deployment, or "" when they can.
function healthWarning() {
  const h = state.health;
  if (!h) return `<p class="small" style="margin:0 0 12px;padding:10px 14px;border-radius:8px;background:var(--warning-light);color:var(--warning-ink)">
    Could not read <code>/api/health</code>. If runs fail, the Netlify functions may not be deployed.</p>`;
  const problems = [];
  if (!h.cloroKeyConfigured) problems.push("<b>CLORO_API_KEY is not set</b> in the Netlify site's environment variables, so every live check will come back as an error.");
  if (h.blobs !== "ok") problems.push(`<b>Netlify Blobs is not available</b> (${esc(h.blobs)}), so nothing can be saved.`);
  if (!problems.length) return "";
  return `<p class="small" style="margin:0 0 12px;padding:10px 14px;border-radius:8px;background:var(--warning-light);color:var(--warning-ink)">
    ${problems.join(" ")}</p>`;
}

async function saveTracked(tracked) {
  const res = await api("/api/projects/import", { method: "POST",
    body: JSON.stringify({ projectId: state.current.project.id, tracked }) });
  return res.ok;
}

// Bing export period, e.g. "May 30 – Aug 26, 2026" (from the overview report when present)
function bingPeriod() {
  const o = state.current?.data?.overview || [];
  if (!o.length) return "the export period";
  const fmt = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return `${fmt(o[0].date)} – ${fmt(o[o.length - 1].date)}`;
}

// ---------- views ----------

function renderPasscode() {
  app.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      <div class="logo"><img src="logo.svg" alt="Wellows" height="24"></div>
      <h2>Enter passcode</h2>
      <p class="muted small" style="margin-top:0">This preview is access protected. Ask the person who shared the link.</p>
      <div class="row">
        <input type="password" id="pc" placeholder="Passcode" style="flex:1">
        <button id="go">Continue</button>
      </div>
    </div></div>`;
  document.getElementById("go").onclick = async () => {
    state.passcode = document.getElementById("pc").value.trim();
    localStorage.setItem("proto_passcode", state.passcode);
    await loadProjects();
  };
  document.getElementById("pc").onkeydown = (e) => { if (e.key === "Enter") document.getElementById("go").click(); };
}

async function loadProjects() {
  const res = await api("/api/projects");
  state.projects = (await res.json()).projects || [];
  state.current = null;
  renderHome();
}

function renderHome() {
  document.getElementById("who").textContent = "";
  app.innerHTML = `
    <div class="panel" style="background:linear-gradient(90deg,#FFF5EF 0%,#ffffff 55%)">
      <h2>See where AI cites you, beyond Bing</h2>
      <p style="max-width:760px">Bing Webmaster Tools reveals which <b>grounding queries</b> made Copilot cite your site.
      This tool turns those into <b>tracked queries</b> and checks, live, whether
      <b>ChatGPT, Perplexity, Gemini, Google AI Mode and AI Overviews</b> cite you for the same questions.
      Bing shows where you already win. The run shows where you don't, yet.</p>
    </div>
    ${healthWarning()}
    <div class="panel">
      <h2>Projects</h2>
      ${state.projects.length ? `<div class="scroll"><table>
        <tr><th>Name</th><th>Domain</th><th>Region</th><th>Created</th><th></th></tr>
        ${state.projects.map((p) => `<tr>
          <td style="font-weight:500">${esc(p.name)}</td><td>${esc(p.domain)}</td><td>${esc(p.region.toUpperCase())}</td>
          <td class="muted">${esc(p.createdAt.slice(0, 10))}</td>
          <td><button class="secondary sm" data-open="${p.id}">Open</button></td></tr>`).join("")}
      </table></div>` : `<p class="muted">No projects yet. Create one below, or load the demo.</p>`}
      <h3>New project</h3>
      <div class="row">
        <div><label>Name</label><input type="text" id="np-name" placeholder="Wellows"></div>
        <div><label>Domain</label><input type="text" id="np-domain" placeholder="wellows.com"></div>
        <div><label>Region</label><input type="text" id="np-region" value="us" style="width:70px"></div>
        <button id="np-create">Create project</button>
        <button class="secondary" id="np-demo">Load demo (wellows.com)</button>
      </div>
    </div>`;
  app.querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => openProject(b.dataset.open)));
  document.getElementById("np-create").onclick = () => createProject(false);
  document.getElementById("np-demo").onclick = () => createProject(true);
}

async function createProject(demo) {
  const body = demo
    ? { name: "Wellows (demo)", domain: "wellows.com", region: "us" }
    : { name: document.getElementById("np-name").value, domain: document.getElementById("np-domain").value, region: document.getElementById("np-region").value || "us" };
  const res = await api("/api/projects", { method: "POST", body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) return toast(data.error || "failed");
  if (demo) {
    toast("Importing demo data…");
    const [q, p, o] = await Promise.all(["queries", "pages", "overview"].map((f) => fetch(`/data/${f}.csv`).then((r) => r.text())));
    await api("/api/projects/import", { method: "POST", body: JSON.stringify({
      projectId: data.project.id,
      queries: parseQueriesReport(q), pages: parsePagesReport(p), overview: parseOverviewReport(o),
    }) });
  }
  await openProject(data.project.id);
}

async function openProject(id) {
  const res = await api(`/api/projects?id=${id}`);
  state.current = await res.json();
  state.suggestions = []; state.selected = new Set(); state.run = null; state.showAllPages = false;
  state.tab = state.current.data ? "overview" : "import";
  renderProject();
}

function renderProject() {
  const { project } = state.current;
  document.getElementById("who").textContent = `${project.name} · ${project.domain}`;
  const tabs = [
    ["overview", "Overview"],
    ["import", "1 · Import Bing data"],
    ["suggest", "2 · Suggested queries"],
    ["run", "3 · Run across LLMs"],
    ["results", "4 · Results"],
  ];
  app.innerHTML = `
    <p style="margin-top:0"><a href="#" id="back">← All projects</a></p>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? "active" : ""}">${l}</button>`).join("")}</div>
    <div id="tabbody"></div>`;
  document.getElementById("back").onclick = (e) => { e.preventDefault(); loadProjects(); };
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { state.tab = b.dataset.tab; renderProject(); }));
  const body = document.getElementById("tabbody");
  if (state.tab === "overview") renderOverview(body);
  if (state.tab === "import") renderImport(body);
  if (state.tab === "suggest") renderSuggest(body);
  if (state.tab === "run") renderRun(body);
  if (state.tab === "results") renderResults(body);
}

// ---- tab 0: overview (Bing data at a glance) ----
function renderOverview(el) {
  const d = state.current.data;
  if (!d) { el.innerHTML = `<div class="panel"><p>No Bing data yet. Start with step 1: Import.</p></div>`; return; }
  const totalCit = d.overview.reduce((s, r) => s + r.citations, 0);
  const pagesCited = d.pages.length;
  const domain = state.current.project.domain;
  const pages = [...d.pages].sort((a, b) => b.citations - a.citations);
  const maxPage = pages.length ? pages[0].citations : 1;
  const shown = state.showAllPages ? pages : pages.slice(0, 15);
  const pathOf = (u) => { try { const x = new URL(u); return (x.hostname.replace(/^www\./, "") === domain ? "" : x.hostname) + x.pathname; } catch { return u; } };

  el.innerHTML = `
    <div class="tiles" style="margin-bottom:20px">
      <div class="tile"><div class="n">${totalCit.toLocaleString()}</div><div class="l">Copilot/Bing citations (${bingPeriod()})</div></div>
      <div class="tile"><div class="n">${d.queries.length.toLocaleString()}</div><div class="l">grounding queries that cited you</div></div>
      <div class="tile"><div class="n">${pagesCited.toLocaleString()}</div><div class="l">pages earning citations</div></div>
      <div class="tile"><div class="n">${state.current.tracked.length}</div><div class="l">queries tracked in this tool</div></div>
    </div>
    ${d.overview.length ? `<div class="panel">
      <h2>Daily citations on Microsoft AI surfaces</h2>
      <div class="chart-wrap" id="trend"></div>
    </div>` : ""}
    <div class="panel">
      <h2>Which pages earn your citations</h2>
      <p class="muted small">From the Bing pages export. The bar compares each page against your most-cited page.</p>
      <div class="scroll"><table>
        <tr><th>Page</th><th>Citations</th><th></th></tr>
        ${shown.map((p) => `<tr>
          <td style="max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            <a href="${esc(p.page)}" target="_blank" rel="noopener">${esc(pathOf(p.page))}</a></td>
          <td>${p.citations.toLocaleString()}</td>
          <td><div class="minitrack"><div class="minibar" style="width:${Math.max(1, Math.round(p.citations / maxPage * 100))}%"></div></div></td>
        </tr>`).join("")}
      </table></div>
      ${pages.length > 15 ? `<p><button class="secondary sm" id="togglepages">${state.showAllPages ? "Show top 15" : `Show all ${pages.length} pages`}</button></p>` : ""}
    </div>`;
  const tp = document.getElementById("togglepages");
  if (tp) tp.onclick = () => { state.showAllPages = !state.showAllPages; renderProject(); };
  if (d.overview.length) drawTrend(document.getElementById("trend"), d.overview);
}

// Single-series line chart, SVG, with crosshair + tooltip on hover.
function drawTrend(mount, rows) {
  const W = Math.min(1180, mount.clientWidth || 900), H = 220;
  const padL = 46, padR = 16, padT = 14, padB = 26;
  const pts = rows.map((r) => ({ t: new Date(r.date + "T00:00:00").getTime(), v: r.citations, date: r.date }));
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vMaxRaw = Math.max(...pts.map((p) => p.v));
  const step = Math.pow(10, Math.floor(Math.log10(vMaxRaw)));
  const vMax = Math.ceil(vMaxRaw / step) * step;
  const X = (t) => padL + (t - t0) / (t1 - t0 || 1) * (W - padL - padR);
  const Y = (v) => padT + (1 - v / vMax) * (H - padT - padB);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const yTicks = [0, vMax / 2, vMax];
  const months = [];
  for (const p of pts) {
    const m = p.date.slice(0, 7);
    if (!months.length || months[months.length - 1].m !== m) months.push({ m, t: p.t });
  }
  // drop a month label that would collide with its neighbor (e.g. a period starting May 30)
  for (let i = months.length - 1; i > 0; i--) {
    if (X(months[i].t) - X(months[i - 1].t) < 44) months.splice(i - 1, 1);
  }
  const fmtM = (m) => new Date(m + "-01T00:00:00").toLocaleDateString("en-US", { month: "short" });
  mount.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily Copilot and Bing citations over time">
      ${yTicks.map((v) => `<line x1="${padL}" y1="${Y(v)}" x2="${W - padR}" y2="${Y(v)}" stroke="#E9ECEF" stroke-width="1"/>
        <text x="${padL - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#ADB5BD">${v.toLocaleString()}</text>`).join("")}
      ${months.map((mo) => `<text x="${X(mo.t)}" y="${H - 8}" font-size="11" fill="#ADB5BD">${fmtM(mo.m)}</text>`).join("")}
      <path d="${path}" fill="none" stroke="#0554F2" stroke-width="2" stroke-linejoin="round"/>
      <circle id="tr-dot" r="4" fill="#0554F2" stroke="#ffffff" stroke-width="2" style="display:none"/>
      <line id="tr-x" y1="${padT}" y2="${H - padB}" stroke="#CED4DA" stroke-width="1" style="display:none"/>
      <rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="transparent" id="tr-hover"/>
    </svg>
    <div class="chart-tip" id="tr-tip"></div>`;
  const svg = mount.querySelector("svg"), hover = mount.querySelector("#tr-hover"),
        dot = mount.querySelector("#tr-dot"), xline = mount.querySelector("#tr-x"),
        tip = mount.querySelector("#tr-tip");
  const fmtD = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  hover.addEventListener("mousemove", (e) => {
    const box = svg.getBoundingClientRect();
    const sx = (e.clientX - box.left) * (W / box.width);
    let best = pts[0], bd = Infinity;
    for (const p of pts) { const dd = Math.abs(X(p.t) - sx); if (dd < bd) { bd = dd; best = p; } }
    dot.style.display = xline.style.display = "block";
    dot.setAttribute("cx", X(best.t)); dot.setAttribute("cy", Y(best.v));
    xline.setAttribute("x1", X(best.t)); xline.setAttribute("x2", X(best.t));
    tip.style.display = "block";
    tip.style.left = (X(best.t) / W * box.width) + "px";
    tip.style.top = (Y(best.v) / H * box.height) + "px";
    tip.textContent = `${fmtD(best.date)}: ${best.v.toLocaleString()} citations`;
  });
  hover.addEventListener("mouseleave", () => {
    dot.style.display = xline.style.display = tip.style.display = "none";
  });
}

// ---- tab 1: import ----
function renderImport(el) {
  const d = state.current.data;
  el.innerHTML = `
    <div class="panel">
      <h2>Import Bing Webmaster Tools exports</h2>
      <p class="muted small">In Bing Webmaster Tools open <b>AI Performance</b>, export the Queries and Pages views as CSV
      (and optionally the overview trend), then upload the files here. Report type is detected automatically.</p>
      ${d ? `<p><span class="pill ok">Imported</span>&nbsp; ${d.queries.length.toLocaleString()} grounding queries · ${d.pages.length} pages · ${d.overview.length} days
        <span class="muted small">(${esc((d.importedAt || "").slice(0, 10))})</span></p>` : ""}
      <div class="row">
        <div style="flex:1"><label>CSV files (select up to 3)</label>
          <input type="file" id="files" accept=".csv" multiple></div>
        <button id="do-import">Import</button>
      </div>
      <p id="import-note" class="muted small"></p>
    </div>`;
  document.getElementById("do-import").onclick = async () => {
    const files = [...document.getElementById("files").files];
    if (!files.length) return toast("Choose the exported CSV files first");
    const payload = { projectId: state.current.project.id };
    const notes = [];
    for (const f of files) {
      const text = await f.text();
      const { type } = detectReportType(text);
      if (type === "queries") { payload.queries = parseQueriesReport(text); notes.push(`${f.name} → queries (${payload.queries.length})`); }
      else if (type === "pages") { payload.pages = parsePagesReport(text); notes.push(`${f.name} → pages (${payload.pages.length})`); }
      else if (type === "overview") { payload.overview = parseOverviewReport(text); notes.push(`${f.name} → trend (${payload.overview.length} days)`); }
      else notes.push(`${f.name} → not recognized (skipped)`);
    }
    document.getElementById("import-note").textContent = notes.join(" · ");
    if (!payload.queries) return toast("No AISearchQueriesReport found among the files");
    const res = await api("/api/projects/import", { method: "POST", body: JSON.stringify(payload) });
    const out = await res.json();
    if (!res.ok) return toast(out.error || "import failed");
    toast("Imported");
    await openProject(state.current.project.id);
  };
}

// ---- tab 2: suggestions ----
function renderSuggest(el) {
  const d = state.current.data;
  if (!d) { el.innerHTML = `<div class="panel"><p>Import Bing data first (step 1).</p></div>`; return; }
  if (!state.suggestions.length) {
    state.suggestions = buildSuggestions(d.queries, { maxSuggestions: 60, minCitations: state.minCitations,
      existingQueries: state.current.tracked.map((t) => t.query) });
    state.selected = new Set();
    state.suggestions.forEach((s, i) => { if (i < 10) state.selected.add(s.groundingQuery); });
  }
  const sugg = state.suggestions;
  el.innerHTML = `
    <div class="panel">
      <h2>Suggested queries from Bing grounding data</h2>
      <p class="muted small">Ranked by citation volume and <b>citation share</b> (the percentage of all citations for that query
      that went to your domain, on Microsoft AI surfaces during ${bingPeriod()}). Near-duplicate queries are folded together
      and the top 10 are pre-selected. <b>Click any query text to edit it before tracking.</b>
      ${state.current.tracked.length ? `Already tracking ${state.current.tracked.length} queries (excluded here).` : ""}</p>
      <div class="row" style="margin-bottom:14px">
        <div><label>Min citations</label><input type="number" id="minc" value="${state.minCitations}" style="width:90px"></div>
        <button class="secondary" id="rebuild">Rebuild</button>
        <span style="flex:1"></span>
        <button id="track">Track selected (<span id="selcount">${state.selected.size}</span>)</button>
      </div>
      <div class="scroll"><table>
        <tr><th></th><th>Query to track (click to edit)</th><th>Bing grounding query</th><th>Intent</th><th>Citations</th><th>Citation share</th><th></th></tr>
        ${sugg.map((s, i) => `<tr>
          <td><input type="checkbox" data-q="${esc(s.groundingQuery)}" ${state.selected.has(s.groundingQuery) ? "checked" : ""}></td>
          <td><input class="qedit" data-qi="${i}" value="${esc(s.suggestedQuery)}">${s.duplicates ? `<div class="muted small">+${s.duplicates.length} similar variants folded</div>` : ""}</td>
          <td class="muted">${esc(s.groundingQuery)}</td>
          <td>${esc(s.wellowsIntent)}</td>
          <td>${(s.citationsCluster ?? s.citations).toLocaleString()}</td>
          <td>${s.citationShare != null ? s.citationShare + "%" : "–"}</td>
          <td>${s.status === "rewrite" ? `<span class="pill warn" title="Machine-style retrieval phrase rewritten into a natural prompt. Edit it if it reads wrong.">rewritten</span>` : `<span class="pill mut">as-is</span>`}</td>
        </tr>`).join("")}
      </table></div>
    </div>`;
  el.querySelectorAll("[data-q]").forEach((cb) => (cb.onchange = () => {
    cb.checked ? state.selected.add(cb.dataset.q) : state.selected.delete(cb.dataset.q);
    document.getElementById("selcount").textContent = state.selected.size;
  }));
  el.querySelectorAll("input.qedit").forEach((inp) => (inp.onchange = () => {
    state.suggestions[Number(inp.dataset.qi)].suggestedQuery = inp.value.trim();
  }));
  document.getElementById("rebuild").onclick = () => {
    state.minCitations = Number(document.getElementById("minc").value) || 1;
    state.suggestions = []; state.selected = new Set(); renderProject();
  };
  document.getElementById("track").onclick = async () => {
    const chosen = sugg.filter((s) => state.selected.has(s.groundingQuery) && s.suggestedQuery);
    if (!chosen.length) return toast("Select at least one query");
    const tracked = [
      ...state.current.tracked,
      ...chosen.map((s) => ({ query: s.suggestedQuery, intent: s.wellowsIntent, sourceGroundingQuery: s.groundingQuery,
        bingCitations: s.citationsCluster ?? s.citations, bingCitationShare: s.citationShare })),
    ];
    if (!(await saveTracked(tracked))) return toast("save failed");
    toast(`Tracking ${tracked.length} queries`);
    await openProject(state.current.project.id);
    state.tab = "run"; renderProject();
  };
}

// ---- tab 3: run ----
function renderRun(el) {
  const tracked = state.current.tracked;
  const providers = runnableProviders().map((k) => [k, PROVIDER_LABELS[k]]);
  const defaultOn = new Set(["openai", "perplexity", "gemini"]);
  el.innerHTML = `
    ${tracked.length ? `<div class="panel">
      <h2>Run tracked queries across AI surfaces</h2>
      ${healthWarning()}
      <p class="muted small">Each selected query is asked live on each provider (the same monitoring pipeline Wellows uses in production)
      and the answer's citations are checked for <b>${esc(state.current.project.domain)}</b>. Capped at 20 queries per run.</p>
      <div class="row">
        <div><label>Queries (top N by Bing citations)</label><input type="number" id="topn" value="${Math.min(5, tracked.length)}" min="1" max="20" style="width:80px"></div>
        <div><label>Providers</label>
          ${providers.map(([k, l]) => `<label style="display:inline-flex;gap:6px;margin-right:12px;color:var(--gray-800);font-weight:400;align-items:center">
            <input type="checkbox" data-p="${k}" ${defaultOn.has(k) ? "checked" : ""}>${l}</label>`).join("")}
        </div>
        <button id="start">Start run</button>
      </div>
      <div id="progress"></div>
    </div>` : `<div class="panel"><p style="margin:0">No tracked queries yet. Accept suggestions in step 2, or add your own below.</p></div>`}
    <div class="panel">
      <h2>Tracked queries (${tracked.length})</h2>
      <div class="row" style="margin-bottom:14px">
        <div style="flex:1;min-width:260px"><label>Add your own query</label>
          <input type="text" id="cq-text" placeholder="e.g. best AI visibility platform for agencies" style="width:100%"></div>
        <div><label>Intent</label><select id="cq-intent">${INTENTS.map((i) => `<option>${i}</option>`).join("")}</select></div>
        <button id="cq-add">Add query</button>
      </div>
      ${tracked.length ? `<div class="scroll"><table>
        <tr><th>Query</th><th>Intent</th><th>Source</th><th>Bing citations</th><th>Bing share</th><th></th></tr>
        ${tracked.map((t, i) => `<tr><td style="font-weight:500">${esc(t.query)}</td><td>${esc(t.intent)}</td>
          <td class="muted small">${t.sourceGroundingQuery ? "Bing suggestion" : "added manually"}</td>
          <td>${t.bingCitations ? t.bingCitations.toLocaleString() : "–"}</td>
          <td>${t.bingCitationShare != null ? t.bingCitationShare + "%" : "–"}</td>
          <td><button class="secondary sm" data-rm="${i}">Remove</button></td></tr>`).join("")}
      </table></div>` : ""}
    </div>`;
  document.getElementById("cq-add").onclick = async () => {
    const q = document.getElementById("cq-text").value.trim();
    if (!q) return toast("Type a query first");
    if (tracked.some((t) => t.query.toLowerCase() === q.toLowerCase())) return toast("Already tracking that query");
    const next = [...tracked, { query: q, intent: document.getElementById("cq-intent").value,
      sourceGroundingQuery: null, bingCitations: null, bingCitationShare: null }];
    if (!(await saveTracked(next))) return toast("save failed");
    toast("Query added");
    await openProject(state.current.project.id);
    state.tab = "run"; renderProject();
  };
  el.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = async () => {
    const next = tracked.filter((_, i) => i !== Number(b.dataset.rm));
    if (!(await saveTracked(next))) return toast("save failed");
    toast("Removed");
    await openProject(state.current.project.id);
    state.tab = "run"; renderProject();
  }));
  const start = document.getElementById("start");
  if (start) start.onclick = async () => {
    const topn = Number(document.getElementById("topn").value) || 5;
    const provs = [...el.querySelectorAll("[data-p]:checked")].map((c) => c.dataset.p);
    if (!provs.length) return toast("Pick at least one provider");
    const queries = [...tracked].sort((a, b) => (b.bingCitations || 0) - (a.bingCitations || 0)).slice(0, topn).map((t) => t.query);
    const runId = crypto.randomUUID().slice(0, 8);
    start.disabled = true;
    let res;
    try {
      res = await api("/api/run", { method: "POST", body: JSON.stringify({
        projectId: state.current.project.id, runId, queries, providers: provs, region: state.current.project.region }) });
    } catch (e) { start.disabled = false; return toast(`Run did not start: ${e.message}`, 6000); }
    if (res.status >= 400) {
      start.disabled = false;
      let detail = ""; try { detail = (await res.json()).error || ""; } catch { /* no body */ }
      return toast(`Run did not start (HTTP ${res.status}${detail ? ": " + detail : ""})`, 6000);
    }
    toast("Run started");
    pollRun(runId, queries.length * provs.length);
  };
}

const NOT_STARTED_MS = 90_000;   // run doc never appeared: function died before its first write
const STALLED_MS = 4 * 60_000;    // no new result in this long: function was killed mid-run

async function pollRun(runId, total) {
  const prog = document.getElementById("progress");
  const note = (html) => { const n = document.getElementById("run-note"); if (n) n.innerHTML = html; };
  if (prog) prog.innerHTML = `<p class="muted small" id="run-note">Running… roughly a minute per query-provider pair.</p><progress max="${total}" value="0"></progress>`;
  const t0 = Date.now();
  let lastDone = -1, lastChange = Date.now();
  const timer = setInterval(async () => {
    try {
      const res = await api(`/api/run-status?projectId=${state.current.project.id}&runId=${runId}`);
      if (res.status === 404) {
        if (Date.now() - t0 > NOT_STARTED_MS) {
          clearInterval(timer);
          note(`<span class="err">The run never started on the server.</span> The run function returned but wrote nothing.
            Check the passcode, and that the site's Netlify plan supports background functions (Pro or above).`);
          const s = document.getElementById("start"); if (s) s.disabled = false;
        }
        return;
      }
      const { run } = await res.json();
      state.run = run;
      const bar = document.querySelector("#progress progress");
      if (bar) bar.value = run.done;
      if (run.done !== lastDone) { lastDone = run.done; lastChange = Date.now(); }
      else if (Date.now() - lastChange > STALLED_MS && run.status !== "completed") {
        note(`<span class="err">No progress for ${Math.round((Date.now() - lastChange) / 60000)} minutes (${run.done}/${run.total} done).</span>
          The run function was probably killed: Netlify only keeps a function alive this long when it runs as a
          <b>background function</b>, which needs a Pro plan or above. Partial results are in step 4.`);
      }
      if (run.status === "completed") {
        clearInterval(timer);
        toast("Run completed");
        await openProject(state.current.project.id);
        state.tab = "results"; renderProject();
      }
    } catch (e) {
      if (String(e.message) === "unauthorized") { clearInterval(timer); return; } // passcode screen is up
      // Non-JSON 404/5xx (functions missing) lands here rather than in the 404 branch above.
      if (lastDone < 0 && Date.now() - t0 > NOT_STARTED_MS) {
        clearInterval(timer);
        note(`<span class="err">The run never started on the server.</span> ${esc(e.message)}`);
        const s = document.getElementById("start"); if (s) s.disabled = false;
      }
      // otherwise a transient poll error — keep polling
    }
  }, 4000);
}

// ---- tab 4: results ----
function renderResults(el) {
  const runs = state.current.runs || [];
  if (!state.run && !runs.length) { el.innerHTML = `<div class="panel"><p>No runs yet. Start one in step 3.</p></div>`; return; }
  const showRun = async (id) => {
    const res = await api(`/api/run-status?projectId=${state.current.project.id}&runId=${id}`);
    state.run = (await res.json()).run; renderProject();
  };
  if (!state.run) { showRun(runs[0].id); el.innerHTML = `<div class="panel">Loading…</div>`; return; }

  const run = state.run;
  const byQuery = new Map();
  for (const r of run.results) {
    if (!byQuery.has(r.query)) byQuery.set(r.query, {});
    byQuery.get(r.query)[r.provider] = r;
  }
  const provs = run.providers;
  const citedCount = (p) => run.results.filter((r) => r.provider === p && r.cited).length;
  const qTotal = byQuery.size;
  el.innerHTML = `
    <div class="panel">
      <div class="row" style="align-items:center;margin-bottom:4px">
        <h2 style="margin:0">Citation coverage <span class="muted small" style="font-weight:400">run ${esc(run.id)} · ${esc(run.startedAt.slice(0, 16).replace("T", " "))} · ${run.status}</span></h2>
        <span style="flex:1"></span>
        <button class="secondary sm" id="exportcsv">Download CSV</button>
      </div>
      <div class="tiles" style="margin:16px 0 20px">
        <div class="tile"><div class="n">${qTotal}</div><div class="l">queries checked</div></div>
        <div class="tile"><div class="n" style="color:var(--success)">${qTotal}/${qTotal}</div><div class="l">in Bing export (${bingPeriod()})</div></div>
        ${provs.map((p) => `<div class="tile"><div class="n">${citedCount(p)}/${qTotal}</div><div class="l">cited on ${PROVIDER_LABELS[p]} (live check)</div></div>`).join("")}
      </div>
      <div class="scroll"><table>
        <tr><th>Query</th><th>Bing export</th>${provs.map((p) => `<th>${PROVIDER_LABELS[p]}${p === "copilot" ? " (live)" : ""}</th>`).join("")}</tr>
        ${[...byQuery.entries()].map(([q, cells], qi) => `<tr class="qrow" data-qi="${qi}" style="cursor:pointer">
          <td style="font-weight:500">${esc(q)} <span class="muted small">▾</span></td>
          <td><span class="pill ok">cited</span></td>
          ${provs.map((p) => {
            const r = cells[p];
            if (!r) return `<td><span class="pill mut">pending</span></td>`;
            if (!r.ok) return `<td><span class="pill warn">error</span></td>`;
            return r.cited
              ? `<td><span class="pill ok">cited</span></td>`
              : `<td><span class="pill bad">not cited</span></td>`;
          }).join("")}
        </tr>
        <tr class="qdetail" data-qd="${qi}" hidden><td colspan="${provs.length + 2}" style="background:var(--gray-100);padding:16px 20px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
          ${provs.map((p) => {
            const r = cells[p];
            let body;
            if (!r) body = `<span class="muted small">pending</span>`;
            else if (!r.ok) body = `<span class="err small">${esc(r.error || "failed")}</span>`;
            else if (!(r.allCitations || []).length) body = `<span class="muted small">answer cited no web sources</span>`;
            else body = (r.allCitations || []).map((u) => {
              const mine = (r.citedUrls || []).includes(u);
              return `<div class="small" style="margin-bottom:4px">${mine
                ? `<span class="pill ok" style="padding:1px 7px">you</span> `
                : ``}<a href="${esc(u)}" target="_blank" rel="noopener">${esc(domainOf(u))}</a></div>`;
            }).join("");
            return `<div><div class="small" style="font-weight:600;color:var(--gray-700);margin-bottom:6px">${PROVIDER_LABELS[p]} cited:</div>${body}</div>`;
          }).join("")}
          </div>
        </td></tr>`).join("")}
      </table></div>
      <p class="muted small" style="margin-bottom:0">"Bing export: cited" is from your Bing Webmaster Tools export, an aggregate over ${bingPeriod()};
      the provider columns are single live checks of each answer's cited sources, matched against ${esc(state.current.project.domain)},
      so the export and the live checks are directional evidence, not a like-for-like comparison. A query in the Bing export can
      still come back "not cited" on a live check: answers vary run to run, and the export covers months of them.
      <b>Click any row</b> to see exactly which sites and pages each AI cited, including the competitors winning answers you are missing from.</p>
      ${runs.length > 1 ? `<h3>Previous runs</h3><p>${runs.map((r) => `<button class="secondary sm" data-run="${r.id}">${r.id} (${r.status})</button>`).join(" ")}</p>` : ""}
    </div>`;
  el.querySelectorAll("[data-run]").forEach((b) => (b.onclick = () => showRun(b.dataset.run)));
  el.querySelectorAll(".qrow").forEach((row) => (row.onclick = () => {
    const d = el.querySelector(`[data-qd="${row.dataset.qi}"]`);
    if (d) d.hidden = !d.hidden;
  }));
  document.getElementById("exportcsv").onclick = () => {
    const csvCell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const head = ["query", "copilot_bing", ...provs.flatMap((p) => [`${p}_status`, `${p}_your_cited_urls`, `${p}_all_cited_domains`])];
    const lines = [head.map(csvCell).join(",")];
    for (const [q, cells] of byQuery.entries()) {
      const row = [q, "cited (Bing export)"];
      for (const p of provs) {
        const r = cells[p];
        if (!r) row.push("pending", "", "");
        else if (!r.ok) row.push(`error: ${r.error || "failed"}`, "", "");
        else row.push(r.cited ? "cited" : "not cited",
          (r.citedUrls || []).join(" "),
          (r.allCitations || []).map(domainOf).join(" "));
      }
      lines.push(row.map(csvCell).join(","));
    }
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ai-citation-coverage-${state.current.project.domain}-run-${run.id}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
}

  try { const h = await fetch("/api/health"); state.health = h.ok ? await h.json() : null; } catch { state.health = null; }
  await loadProjects();
} catch (e) {
  if (String(e.message) !== "unauthorized") {
    app.innerHTML = `<div class="panel err">Failed to load: ${esc(e.message)}</div>`;
  }
}
